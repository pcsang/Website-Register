server:
  port: 8080

spring:
  application:
    name: register-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/information_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

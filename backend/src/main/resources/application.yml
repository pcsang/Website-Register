server:
  # Render (and most PaaS hosts) assign the listen port dynamically via $PORT at runtime; local dev,
  # Docker Compose, and any environment without PORT set keep the existing default of 8080.
  port: ${PORT:8080}

spring:
  application:
    name: register-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/information_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway (below) owns schema changes now - Hibernate only checks entities match the DB, never
      # alters it. See db/migration/V1__init_schema.sql and CHECKLIST.md's Phase 22 entry.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Lets Flyway adopt a pre-existing local/dev database (tables created by the old ddl-auto=update
    # workflow, no flyway_schema_history yet) by treating it as already at baseline-version (default "1",
    # i.e. V1) instead of failing with "schema already contains objects". No effect on a fresh/empty
    # database (e.g. a brand-new Neon instance) - migrations just run normally there.
    baseline-on-migrate: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-CHANGE-ME-before-any-real-deploy-32bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:dev-only-ChangeMe123!}
  dashboard:
    # Cap on the number of rows returned by the "upcoming course schedule" section of
    # GET /api/admin/dashboard/overview - the design mockup shows 4 rows.
    upcoming-courses-limit: ${DASHBOARD_UPCOMING_COURSES_LIMIT:4}

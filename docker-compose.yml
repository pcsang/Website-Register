# Local development stack: Spring Boot backend + PostgreSQL.
#
# Override any of these by copying .env.example to .env (docker compose reads it automatically) or by
# exporting the same-named variables in your shell before running `docker compose up`. The defaults below
# are dev-only — never used for the production database (Neon, Phase 22) or a real deployment.

services:
  postgres:
    image: postgres:16
    container_name: register-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-information_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: register-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-information_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-signing-secret-CHANGE-ME-before-any-real-deploy-32bytes}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
